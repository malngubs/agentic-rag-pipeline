<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macrocomm AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <div class="app-header">
        <div class="header-content">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 3 .97 4.29L2 22l5.71-.97C9 21.64 10.46 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/>
                </svg>
                <span>Macrocomm AI</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="openDashboard()" title="Open BI Platform">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                    </svg>
                </button>
                <button class="icon-btn" onclick="showSettings()" title="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                    </svg>
                </button>
                <button class="icon-btn" onclick="minimizeWindow()" title="Minimize to tray">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 13H5v-2h14v2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="app-content">
        <!-- Quick Search Bar -->
        <div class="search-container">
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="Quick search... (or ask a question below)"
                    onkeypress="handleSearchKeypress(event)"
                />
            </div>
        </div>

        <!-- Status Indicator -->
        <div class="status-bar">
            <div class="status-indicator" id="status-indicator">
                <div class="status-dot online" id="status-dot"></div>
                <span id="status-text">Connected</span>
            </div>
            <div class="offline-badge" id="offline-badge" style="display: none;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zm-6.6 8.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/>
                </svg>
                Offline Mode
            </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chat-messages">
            <!-- Welcome message -->
            <div class="message assistant welcome">
                <div class="message-avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                <div class="message-content">
                    <p>👋 Welcome to Macrocomm AI Assistant!</p>
                    <p class="message-hint">Ask me anything about your company knowledge base. I'm here to help you work smarter.</p>
                    <div class="quick-actions">
                        <button class="quick-btn" onclick="askQuestion('What are the key company policies?')">📋 Company Policies</button>
                        <button class="quick-btn" onclick="askQuestion('How do I submit an expense report?')">💰 Expense Reports</button>
                        <button class="quick-btn" onclick="askQuestion('What is the vacation policy?')">🏖️ Vacation Policy</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-container">
            <div class="input-wrapper">
                <textarea
                    id="chat-input"
                    class="chat-input"
                    placeholder="Ask a question..."
                    rows="1"
                    onkeypress="handleChatKeypress(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
            <div class="input-hint">
                Press <kbd>Enter</kbd> to send • <kbd>Shift+Enter</kbd> for new line • <kbd>{{ hotkey }}</kbd> to toggle window
            </div>
        </div>
    </div>

    <!-- Settings Panel (hidden by default) -->
    <div class="settings-panel" id="settings-panel" style="display: none;">
        <div class="settings-header">
            <h2>Settings</h2>
            <button class="icon-btn" onclick="hideSettings()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>

        <div class="settings-content">
            <div class="setting-group">
                <label class="setting-label">Backend API URL</label>
                <input type="text" id="setting-api-url" class="setting-input" placeholder="http://localhost:8000" />
            </div>

            <div class="setting-group">
                <label class="setting-label">Global Hotkey</label>
                <input type="text" id="setting-hotkey" class="setting-input" placeholder="CommandOrControl+Shift+M" readonly />
                <p class="setting-hint">Click to record new hotkey combination</p>
            </div>

            <div class="setting-group">
                <label class="setting-toggle">
                    <input type="checkbox" id="setting-always-on-top" onchange="updateSetting('alwaysOnTop', this.checked)" />
                    <span>Always on top</span>
                </label>
            </div>

            <div class="setting-group">
                <label class="setting-toggle">
                    <input type="checkbox" id="setting-auto-start" onchange="updateSetting('autoStart', this.checked)" />
                    <span>Start on system boot</span>
                </label>
            </div>

            <div class="setting-group">
                <label class="setting-toggle">
                    <input type="checkbox" id="setting-offline-mode" onchange="updateSetting('offlineMode', this.checked)" />
                    <span>Offline mode (use cached data)</span>
                </label>
            </div>

            <div class="setting-actions">
                <button class="btn-primary" onclick="saveSettings()">Save Settings</button>
                <button class="btn-secondary" onclick="hideSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
